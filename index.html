<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深海机器人观测站 · 水下机器人论文、著作、政策与行业动态</title>
  <meta name="description" content="深海机器人观测站：水下机器人领域的前沿论文、经典著作、政策法规与行业动态，每条均附来源链接，支持全站检索。" />
  <link rel="canonical" href="https://momo1986.github.io/underwater-robotics-hub/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="深海机器人观测站" />
  <meta property="og:title" content="深海机器人观测站 · 水下机器人论文、著作、政策与行业动态" />
  <meta property="og:description" content="深海机器人观测站：水下机器人领域的前沿论文、经典著作、政策法规与行业动态，每条均附来源链接，支持全站检索。" />
  <meta property="og:url" content="https://momo1986.github.io/underwater-robotics-hub/" />
  <meta name="theme-color" content="#03080f" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    /* 尽早应用主题，避免闪烁：优先用户选择，其次跟随系统 */
    try {
      var t = localStorage.getItem("uwr-theme");
      if (t === "light" || (!t && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.classList.add("light");
    } catch (e) {}
  </script>
</head>
<body class="home">
  <header id="site-header" class="topbar"></header>

  <main id="top">
    <section class="station">
      <div class="station-text">
        <p class="eyebrow"><span class="dot"></span>STATION ONLINE · 持续观测中</p>
        <h1 class="station-title">深海机器人<br /><em>观测站</em></h1>
        <p class="station-sub">
          持续收录水下机器人领域的<b>研究论文</b>、<b>经典著作</b>、<b>政策法规</b>与<b>行业动态</b>。
          每条内容都附来源链接，顺着线索就能读到原文。
        </p>
        <form class="search-wrap" action="search.html" method="get" role="search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="homeSearch" name="q" type="search" placeholder="搜索标题、作者、机构、摘要与标签…" autocomplete="off" aria-label="全站搜索" />
          <button class="search-go" type="submit">检索</button>
        </form>
      </div>
      <div class="sonar" id="sonar" aria-label="各栏目条目数">
        <div class="sonar-sweep" aria-hidden="true"></div>
        <span class="sonar-label sonar-n">N</span><span class="sonar-label sonar-e">E</span>
        <span class="sonar-label sonar-s">S</span><span class="sonar-label sonar-w">W</span>
      </div>
    </section>

    <div class="readout" id="readout"></div>

    <div id="previews"></div>
  </main>

  <footer id="site-footer" class="footer"></footer>

  <script src="js/data/papers.js"></script>
  <script src="js/data/books.js"></script>
  <script src="js/data/policies.js"></script>
  <script src="js/data/news.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
